<html><span><select id="themeSelect" style="width:100%; background: rgba(0, 0, 0, 0.3">
  <option value="theme-default">Temas</option>
  <option value="theme-theme1">Tema 1: Color</option>
  <option value="theme-theme2">Tema 2: Color</option>
  <option value="theme-space">Tema: Espacio</option>
  <option value="theme-starwars">Tema Star Wars</option>
  <option value="theme-jurassicworld">Tema: Jurassic World</option>
  <option value="theme-taylorswift">Tema: Taylor Swift</option>
  <option value="theme-superheroes">Tema: Super Héroes</option>
  <option value="theme-naturaleza1">Tema Natulareza: Amanecer/Atardecer</option>
  <option value="theme-naturaleza2">Tema Naturaleza: Polos</option>
  <option value="theme-naturaleza3">Tema Naturaleza: Mar</option>
  <option value="theme-naturaleza4">Tema Naturaleza: Selva</option>
<option value="theme-httyd">Tema: Cómo Entrenar A Tu Dragón</option>
  <option value="theme-pokemon">Tema: Pokémon</option>
  <option value="theme-thewildrobot">Tema: The Wild Robot</option>
  <option value="theme-wicked">Tema: Wicked</option>
<option value="theme-gstudios1">Tema G.Studios: Si Fuera</option>
  <option value="theme-gstudios2">Tema G.Studios: The Night Sky</option>
    <option value="theme-gstudios3">Tema G.Studios: La Magia de la Estrella Polar</option>
  <option value="theme-gstudios4">Tema G.Studios: Unstoppable Friendship</option>
  <option value="theme-gstudios5">Tema G.Studios: Libra</option>
  <option value="theme-gstudios6">Tema G.Studios: The Treasure</option>
  <option value="theme-gstudios7">Tema G.Studios: Yo Quiero - A New World</option>
  <!-- Añade tantas opciones como diseños tengas -->
</select></span>
</html>
<script>
var themeSelect = document.getElementById('themeSelect');
// Cuando se cambia el tema
themeSelect.addEventListener('change', function() {
    // Obtiene todos los elementos a los que se les aplicará el cambio de tema
    var elements = document.querySelectorAll('p, body, main, mainTop, h1, h2, h3, h4, h5, h6, article, section, aside, panel');

    // Elimina las clases de las opciones antiguas
    elements.forEach(function(element) {
        element.classList.remove('theme-theme1', 'theme-theme2', 'theme-space', 'theme-starwars', 'theme-jurassicworld', 'theme-taylorswift', 'theme-superheroes', 'theme-naturaleza1', 'theme-naturaleza2', 'theme-naturaleza3', 'theme-naturaleza4', 'theme-pokemon', 'theme-thewildrobot', 'theme-httyd', 'theme-gstudios1', 'theme-gstudios2', 'theme-gstudios3', 'theme-gstudios4', 'theme-gstudios5', 'theme-gstudios6', 'theme-gstudios7', 'theme-wicked');
    });

    // Si la opción seleccionada no es "default", añade la clase de la opción seleccionada
    if (this.value !== 'default') {
        elements.forEach(function(element) {
            element.classList.add(this.value);
        }.bind(this));
    }

    // Guarda la selección del usuario en el almacenamiento local
    localStorage.setItem('selectedTheme', this.value);
});

// Cuando se carga la página
window.addEventListener('load', function() {
    // Obtiene la selección del usuario del almacenamiento local
    var selectedTheme = localStorage.getItem('selectedTheme');

    // Si hay una selección guardada y no es "default", aplica el tema seleccionado
    if (selectedTheme && selectedTheme !== 'gstudios') {
        var elements = document.querySelectorAll('p, body, main, mainTop, h1, h2, h3, h4, h5, h6, article, section, aside, panel');
        elements.forEach(function(element) {
            element.classList.add(selectedTheme);
        });
        themeSelect.value = selectedTheme;
    }
});
</script>
