<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Procesando API...</title>
</head>
<body>
    <p>Conectando con el servidor...</p>

    <script>
        window.onload = async function() {
            const search = window.location.search;
            
            // Tu URL base limpia de Google Apps Script (asegúrate de que NUNCA tenga /u/0/)
            let googleBaseUrl = "https://script.google.com/macros/s/AKfycbyx2ZKEOGThYPBLjDeavIn1EYF9tmcYieT-6mfvAZAeiR0-nO__NKiJTejXxjJGJCBaBA/exec";
            
            if (search) {
                const target = "endpoint=";
                const index = search.indexOf(target);
                
                if (index !== -1) {
                    const restoDeParametros = search.substring(index + target.length);
                    const targetUrl = `${googleBaseUrl}?api=true&endpoint=${restoDeParametros}`;
                    
                    try {
                        // Usamos fetch desde GitHub Pages para saltarnos el conflicto de cookies de Chrome
                        const response = await fetch(targetUrl);
                        const data = await response.text();
                        
                        document.open();
                        document.write(data);
                        document.close();
                        return;
                    } catch (error) {
                        document.body.innerText = "Error de comunicación con la API.";
                        return;
                    }
                }
            }
            document.body.innerText = "Solicitud no válida.";
        };
    </script>
</body>
</html>
